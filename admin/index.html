<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin — Aesthée</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body data-admin-page="list">
  <div id="loginView" class="login-wrap hidden">
    <form class="panel login-card" id="loginForm">
      <h1>Aesthée Admin</h1>
      <p>Σύνδεση προσωπικού για διαχείριση πελατών.</p>
      <div id="configBanner" class="banner-warn hidden">
        Λείπει το <code>js/supabase-config.js</code>. Αντιγράψτε από το
        <code>supabase-config.example.js</code> και βάλτε URL + anon key.
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Κωδικός</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn btn-gold" type="submit" style="width:100%">Σύνδεση</button>
    </form>
  </div>

  <div id="appView" class="admin-shell hidden">
    <header class="admin-top">
      <div class="admin-brand">
        <img src="../images/logo-emblem.svg" alt="" />
        <div>
          <strong>Aesthée</strong>
          <span>Πελάτες</span>
        </div>
      </div>
      <div class="admin-actions">
        <a class="btn btn-gold" href="client.html">Νέος πελάτης</a>
        <button class="btn btn-ghost" type="button" id="signOutBtn">Αποσύνδεση</button>
      </div>
    </header>

    <div class="toolbar">
      <input class="search" id="searchInput" type="search" placeholder="Αναζήτηση ονόματος, τηλεφώνου ή email…" />
    </div>

    <div class="panel table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ονοματεπώνυμο</th>
            <th>Τηλέφωνο</th>
            <th>Email</th>
            <th>Επισκέψεις</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="clientsBody">
          <tr><td colspan="5" class="empty">Φόρτωση…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="adminToast" role="status"></div>
  <script src="../js/supabase-config.js"></script>
  <script type="module" src="../js/admin-list.js"></script>
</body>
</html>
