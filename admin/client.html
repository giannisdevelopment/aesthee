<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Πελάτης — Aesthée Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body data-admin-page="client">
  <div class="admin-shell">
    <header class="admin-top">
      <div class="admin-brand">
        <img src="/images/logo-emblem.svg" alt="" />
        <div>
          <strong>Aesthée</strong>
          <span>Καρτέλα πελάτη</span>
        </div>
      </div>
      <div class="admin-actions">
        <nav class="admin-nav">
          <a href="/admin/">Πελάτες</a>
          <a href="/admin/bookings">Ραντεβού</a>
          <a href="/admin/services">Τιμές</a>
          <a href="/admin/messages">Μηνύματα</a>
        </nav>
        <a class="btn btn-ghost" href="/admin/">← Πελάτες</a>
        <button class="btn btn-ghost" type="button" id="signOutBtn">Αποσύνδεση</button>
      </div>
    </header>

    <div class="page-head">
      <div>
        <h1 id="pageTitle">Νέος πελάτης</h1>
        <p class="muted" id="pageSub">Συμπληρώστε στοιχεία, ιστορικό και σημειώσεις.</p>
      </div>
      <button class="btn btn-danger btn-sm hidden" type="button" id="deleteClientBtn">Διαγραφή πελάτη</button>
    </div>

    <div class="grid-2">
      <section class="panel panel-pad">
        <h2 class="section-title">Στοιχεία</h2>
        <form id="clientForm">
          <div class="field">
            <label for="fullName">Ονοματεπώνυμο</label>
            <input id="fullName" name="full_name" type="text" required autocomplete="name" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="phone">Τηλέφωνο</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" />
            </div>
          </div>
          <div class="field">
            <label for="medicalHistory">Ιατρικό ιστορικό</label>
            <textarea id="medicalHistory" name="medical_history" placeholder="Αλλεργίες, φάρμακα, αντενδείξεις…"></textarea>
          </div>
          <div class="field">
            <label for="notes">Σημειώσεις</label>
            <textarea id="notes" name="notes" placeholder="Γενικές σημειώσεις για τον πελάτη"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-gold" type="submit" id="saveClientBtn">Αποθήκευση</button>
          </div>
        </form>
      </section>

      <section class="panel panel-pad" id="visitsPanel">
        <div class="toolbar" style="margin-bottom:12px">
          <h2 class="section-title" style="margin:0">Θεραπείες / πληρωμές</h2>
          <button class="btn btn-ghost btn-sm" type="button" id="toggleVisitFormBtn">+ Επίσκεψη</button>
        </div>

        <form id="visitForm" class="hidden" style="margin-bottom:18px">
          <input type="hidden" id="visitId" value="" />
          <div class="field">
            <label for="treatment">Θεραπεία</label>
            <select id="treatment" name="treatment" required>
              <option value="">Φόρτωση καταλόγου…</option>
            </select>
            <input
              id="treatmentCustom"
              name="treatment_custom"
              type="text"
              class="hidden"
              placeholder="Πληκτρολογήστε την θεραπεία"
              style="margin-top:8px"
            />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="paymentAmount">Ποσό πληρωμής (€)</label>
              <input id="paymentAmount" name="payment_amount" type="number" min="0" step="0.01" />
            </div>
            <div class="field">
              <label for="paymentDate">Ημερομηνία πληρωμής</label>
              <input id="paymentDate" name="payment_date" type="date" />
            </div>
          </div>
          <div class="field">
            <label for="visitNotes">Σημειώσεις επίσκεψης</label>
            <textarea id="visitNotes" name="notes" placeholder="Προαιρετικά"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-gold btn-sm" type="submit">Αποθήκευση επίσκεψης</button>
            <button class="btn btn-ghost btn-sm" type="button" id="cancelVisitBtn">Ακύρωση</button>
          </div>
        </form>

        <div id="visitsList">
          <p class="empty">Αποθηκεύστε τον πελάτη για να προσθέσετε επισκέψεις.</p>
        </div>
      </section>
    </div>
  </div>

  <div class="toast" id="adminToast" role="status"></div>
  <script src="/js/supabase-config.js"></script>
  <script type="module" src="/js/admin-client.js"></script>
</body>
</html>
